<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DARK DINU V1 | PAIRING ENGINE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050508;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 0, 55, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(255, 0, 55, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 55, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            padding: 20px;
        }
        .cyber-card {
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 60, 0.3);
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 0 35px rgba(255, 0, 55, 0.18);
            position: relative;
        }
        .cyber-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, #ff003c, #ff416c, transparent);
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            text-align: center;
            color: #fff;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.7);
        }
        .subtitle {
            text-align: center;
            color: #8b8b9e;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #00ff88;
            font-weight: 700;
        }
        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }
        label {
            display: block;
            font-size: 12px;
            color: #ff003c;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 700;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(20, 20, 30, 0.7);
            border: 1px solid rgba(255, 0, 60, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
            font-family: 'Orbitron', monospace;
            outline: none;
            margin-bottom: 20px;
        }
        input:focus {
            border-color: #ff003c;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff003c, #990024);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4);
        }
        button:hover {
            box-shadow: 0 0 30px rgba(255, 0, 60, 0.7);
        }
        #codeBox {
            display: none;
            margin-top: 25px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px dashed #ff003c;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }
        .code-text {
            font-family: 'Orbitron', monospace;
            font-size: 30px;
            color: #00ffcc;
            letter-spacing: 5px;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            margin: 10px 0;
            user-select: all;
        }
        .instructions {
            font-size: 12px;
            color: #8b8b9e;
        }
    </style>
</head>
<body>
    <div class="cyber-card">
        <h1>DARK DINU V1</h1>
        <div class="subtitle">MULTI-DEVICE ENGINE 2026</div>

        <div class="status-badge">
            <div class="dot"></div>
            <span>ENGINE ONLINE</span>
        </div>

        <label>WhatsApp Number (With Country Code)</label>
        <input type="text" id="phone" placeholder="94719845166">

        <button id="submitBtn" onclick="requestPairing()">GENERATE PAIRING CODE</button>

        <div id="codeBox">
            <div style="font-size: 11px; color: #ff003c; letter-spacing: 1px;">PAIRING CODE:</div>
            <div class="code-text" id="codeDisplay">----</div>
            <div class="instructions">WhatsApp ➜ Linked Devices ➜ Link with phone number</div>
        </div>
    </div>

    <script>
        async function requestPairing() {
            const phoneInput = document.getElementById('phone');
            const codeBox = document.getElementById('codeBox');
            const codeDisplay = document.getElementById('codeDisplay');
            const btn = document.getElementById('submitBtn');
            const num = phoneInput.value.replace(/[^0-9]/g, '');

            if (!num || num.length < 10) {
                alert('වලංගු දුරකථන අංකයක් ඇතුළත් කරන්න (උදා: 94719845166)');
                return;
            }

            btn.disabled = true;
            btn.innerText = 'GENERATING...';
            codeBox.style.display = 'block';
            codeDisplay.innerText = 'PLEASE WAIT...';

            try {
                const res = await fetch(`/pair?phone=${num}`);
                const data = await res.json();

                if (data.code) {
                    codeDisplay.innerText = data.code;
                } else {
                    codeDisplay.innerText = data.error || 'TRY AGAIN';
                }
            } catch (err) {
                codeDisplay.innerText = 'FAILED';
            } finally {
                btn.disabled = false;
                btn.innerText = 'GENERATE PAIRING CODE';
            }
        }
    </script>
</body>
</html>
